name: Publish released web game
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        default: v0.0.38
      refresh_spec:
        description: Refresh reviewed specification from main (must match release version)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start deployment from protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -f ref=main -f "inputs[tag]=$RELEASE_TAG"
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the released web build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir release _site
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          web_asset=$(grep -m1 '^Cyber-Kingdom-Demo-Web-' <<<"$assets" || true)
          if [ -z "$web_asset" ]; then web_asset='Cyber-Kingdom-Web-*.zip'; fi
          patterns=(--pattern "$web_asset" --pattern 'SHA256SUMS.txt')
          # Releases from v0.0.61 also publish the main game's web build under main/.
          main_asset=$(grep -m1 '^Cyber-Kingdom-Main-Web-' <<<"$assets" || true)
          if [ -n "$main_asset" ]; then patterns+=(--pattern "$main_asset"); fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" --dir release
          python3 tools/unpack_release_site.py --release release --site _site
      - name: Include matching game specification
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REFRESH_SPEC: ${{ inputs.refresh_spec }}
        run: |
          args=()
          if [ "$REFRESH_SPEC" = 'true' ]; then args+=(--refresh); fi
          python3 tools/build_game_spec.py --publish-site _site --tag "$RELEASE_TAG" --source-ref "$GITHUB_SHA" "${args[@]}"
      - name: Install matching gameplay sharing preview
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/install_social_preview.py --site _site --edition demo --tag "$RELEASE_TAG"
          # Demo-only releases retain an older Main archive unchanged, including its sharing metadata.
          if [ -f "release/Cyber-Kingdom-Main-Web-${RELEASE_TAG}.zip" ]; then
            python3 tools/install_social_preview.py --site _site/main --edition full --tag "$RELEASE_TAG"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
