name: Publish released web game
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        default: v0.0.38
      refresh_spec:
        description: Refresh reviewed specification from main (must match release version)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start deployment from protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -f ref=main -f "inputs[tag]=$RELEASE_TAG"
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the released web build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir release _site
          web_asset=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(startswith("Cyber-Kingdom-Demo-Web-"))][0] // empty')
          if [ -z "$web_asset" ]; then web_asset='Cyber-Kingdom-Web-*.zip'; fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$web_asset" --pattern 'SHA256SUMS.txt' --dir release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path('release')
          archives = list(root.glob('Cyber-Kingdom-Demo-Web-*.zip')) or list(root.glob('Cyber-Kingdom-Web-*.zip'))
          if len(archives) != 1:
              raise SystemExit('Expected one web archive')
          archive = archives[0]
          checksums = dict(line.split(maxsplit=1)[::-1] for line in (root/'SHA256SUMS.txt').read_text().splitlines())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != checksums.get(archive.name):
              raise SystemExit('Web archive checksum mismatch')
          destination = Path('_site').resolve()
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  target = (destination/entry.filename).resolve()
                  if not target.is_relative_to(destination) or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Unsafe archive path')
              bundle.extractall(destination)
          for name in ('index.html', 'index.js', 'index.wasm', 'index.pck', 'guide.html'):
              if not (destination/name).is_file() or (destination/name).stat().st_size == 0:
                  raise SystemExit('Missing web runtime: '+name)
          (destination/'.nojekyll').touch()
          PY
      - name: Include matching game specification
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REFRESH_SPEC: ${{ inputs.refresh_spec }}
        run: |
          args=()
          if [ "$REFRESH_SPEC" = 'true' ]; then args+=(--refresh); fi
          python3 tools/build_game_spec.py --publish-site _site --tag "$RELEASE_TAG" --source-ref "$GITHUB_SHA" "${args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
