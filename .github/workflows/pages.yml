name: Deploy published game artifacts
on:
  push:
    branches: [main]
    paths: [branding/logo-trial.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing verified Web archives
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Poyueh/cyber-kingdom-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify released builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.0.85' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-main)?$ ]] || exit 1
          mkdir release _site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*Web-*.zip' --pattern SHA256SUMS.txt
          # Keep the existing Main site; never silently remove it on a Demo-only release.
          compgen -G 'release/Cyber-Kingdom-Main-Web-*.zip' >/dev/null || exit 1
          python3 tools/audit_public_distribution.py --release release
          python3 tools/unpack_release_site.py --release release --site _site
          python3 tools/audit_public_distribution.py --release release --site _site
      - name: Apply verified loading-logo revision (Demo only)
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v0.0.85' }}
        run: |
          python3 tools/test_apply_loading_logo.py
          python3 tools/apply_loading_logo.py --site _site --branding branding --release-tag "$RELEASE_TAG"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

